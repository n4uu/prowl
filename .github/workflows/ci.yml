name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: demo hunt (synthetic dataset, no network)
        run: |
          set -eu
          go run ./cmd/prowl demo -out /tmp/prowl-out
          grep -q '203.0.113.47:1418' /tmp/prowl-out/indicators.csv

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: validate STIX and MISP exports against the reference libraries
        run: |
          pip install stix2 pymisp
          python3 scripts/validate_exports.py /tmp/prowl-out
